services:
  - type: web
    name: bumba-patrimonio-vivo
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bumba-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false

databases:
  - name: bumba-db
    plan: free
